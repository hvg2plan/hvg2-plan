<style>
*{box-sizing:border-box;-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans CJK SC",sans-serif;
background:#F7F7F5;color:#1A1A1A;font-size:14px;line-height:1.5}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #E5E5E2;padding:12px 14px;z-index:5}
h1{margin:0 0 6px;font-size:16px;font-weight:600}
.meta{font-size:12px;color:#6B6B66;margin-bottom:8px}
input[type=search]{width:100%;padding:10px 12px;font-size:15px;border:1px solid #D8D8D3;border-radius:10px;background:#fff}
.stats{display:flex;gap:8px;overflow:auto;padding:10px 14px 0}
.stat{flex:0 0 auto;background:#fff;border:1px solid #E5E5E2;border-radius:10px;padding:8px 12px;min-width:92px}
.stat b{display:block;font-size:16px;font-weight:600}
.stat span{font-size:11px;color:#6B6B66}
.wrap{padding:12px 14px 40px}
.scroller{overflow:auto;background:#fff;border:1px solid #E5E5E2;border-radius:10px}
table{border-collapse:collapse;font-size:12px;width:max-content;min-width:100%}
th,td{padding:6px 8px;border-bottom:1px solid #EFEFEC;white-space:nowrap;text-align:right}
th{background:#F1F1EE;font-weight:600;position:sticky;top:0}
th.p,td.p{text-align:left;position:sticky;left:0;background:#fff;font-weight:500}
th.p{background:#F1F1EE;z-index:2}
td.zero{color:#C9C9C4}
td.hot{background:#FDECEC;color:#A32D2D;font-weight:500}
.empty{padding:24px;text-align:center;color:#6B6B66;background:#fff;border:1px solid #E5E5E2;border-radius:10px}
footer{padding:8px 14px 24px;font-size:11px;color:#8A8A85}
</style><style>
#gate{position:fixed;inset:0;background:#F7F7F5;display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.gate-box{width:100%;max-width:340px;background:#fff;border:1px solid #E5E5E2;border-radius:14px;padding:22px 20px}
.gate-title{font-size:17px;font-weight:600;margin-bottom:4px}
.gate-sub{font-size:12px;color:#6B6B66;margin-bottom:16px;line-height:1.6}
#pw{width:100%;padding:11px 12px;font-size:15px;border:1px solid #D8D8D3;border-radius:10px;background:#fff}
#go{width:100%;margin-top:10px;padding:11px;font-size:15px;font-weight:600;color:#fff;background:#185FA5;border:0;border-radius:10px}
#go:disabled{background:#B4B2A9}
.rem{display:block;margin-top:10px;font-size:12px;color:#6B6B66}
.gate-err{margin-top:10px;font-size:12px;color:#A32D2D;min-height:16px;word-break:break-all}
.blk{margin-bottom:20px}
.blk-h{font-size:13px;font-weight:600;color:#3A3A36;margin:0 0 8px}
#msel{width:100%;padding:10px 12px;font-size:15px;border:1px solid #D8D8D3;border-radius:10px;
background:#fff;margin-bottom:8px;-webkit-appearance:none;appearance:none}
#msel:disabled{color:#8A8A85;background:#F1F1EE}
.mstats{display:flex;gap:8px;overflow:auto;padding-bottom:2px}
.mstats:empty{display:none}
.mstats .stat{min-width:70px;padding:6px 10px}
.mstats .stat b{font-size:14px}
.w{display:block;font-size:10px;color:#8A8A85;font-weight:400}
</style>

var td=(typeof TextDecoder!=='undefined')?new TextDecoder('utf-8'):null;
function utf8(u8){
  if(td){ try{ return td.decode(u8); }catch(e){} }
  var s='';
  for(var i=0;i<u8.length;i++){ var c=u8[i];
    if(c<128){ s+=String.fromCharCode(c); continue; }
    if(c<224){ s+=String.fromCharCode(((c&31)<<6)|(u8[++i]&63)); continue; }
    s+=String.fromCharCode(((c&15)<<12)|((u8[++i]&63)<<6)|(u8[++i]&63));
  }
  try{ return decodeURIComponent(escape(s)); }catch(e){ return unescape(s); }
}
function utf8enc(str){
  if(typeof TextEncoder!=='undefined'){ return new TextEncoder().encode(str); }
  var out=[], i, c;
  for(i=0;i<str.length;i++){ c=str.charCodeAt(i);
    if(c<128) out.push(c);
    else if(c<2048){ out.push(192|(c>>6), 128|(c&63)); }
    else { out.push(224|(c>>12), 128|((c>>6)&63), 128|(c&63)); }
  }
  return new Uint8Array(out);
}

function sha256(msg){
  var ml=msg.length;
  var zeros=((56-((ml+1)%64))+64)%64;
  var total=ml+1+zeros+8;
  var buf=new Uint8Array(total), i;
  buf.set(msg); buf[ml]=0x80;
  // 末尾 8 字节大端写消息位长
  var bits=ml*8;
  new DataView(buf.buffer).setUint32(total-8, Math.floor(bits/4294967296));
  new DataView(buf.buffer).setUint32(total-4, bits>>>0);
  var dv=new DataView(buf.buffer), w=new Uint32Array(64);
  var H=H256.slice();
  for(var off=0;off<total;off+=64){
    for(i=0;i<16;i++) w[i]=dv.getUint32(off+i*4);
    for(i=16;i<64;i++){
      var a15=w[i-15], a2=w[i-2];
      var s0=(rotr(a15,7)^rotr(a15,18)^(a15>>>3))>>>0;
      var s1=(rotr(a2,17)^rotr(a2,19)^(a2>>>10))>>>0;
      w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;
    }
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(i=0;i<64;i++){
      var S1=(rotr(e,6)^rotr(e,11)^rotr(e,25))>>>0;
      var ch=((e&f)^((~e)&g))>>>0;
      var t1=(h+S1+ch+K256[i]+w[i])>>>0;
      var S0=(rotr(a,2)^rotr(a,13)^rotr(a,22))>>>0;
      var mj=((a&b)^(a&c)^(b&c))>>>0;
      var t2=(S0+mj)>>>0;
      h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
  }
  var out=new Uint8Array(32);
  dv=new DataView(out.buffer);
  for(i=0;i<8;i++) dv.setUint32(i*4,H[i]);
  return out;
}

  var pwb=utf8enc(pwd), i;

function rc4(key,data){
  var S=new Uint8Array(256), i, j=0, kl=key.length;
  for(i=0;i<256;i++) S[i]=i;
  for(i=0;i<256;i++){ j=(j+S[i]+key[i%kl])&255; var t=S[i]; S[i]=S[j]; S[j]=t; }
  var out=new Uint8Array(data.length), i2=0, j2=0;
  for(var n=0;n<data.length;n++){
    i2=(i2+1)&255; j2=(j2+S[i2])&255;
    var tt=S[i2]; S[i2]=S[j2]; S[j2]=tt;
    out[n]=data[n]^S[(S[i2]+S[j2])&255];
  }
  return out;
}

function b64ToBytes(b64){
  var s=(typeof atob!=='undefined')?atob(b64):new Buffer(b64,'base64').toString('binary');
  var u=new Uint8Array(s.length);
  for(var i=0;i<s.length;i++) u[i]=s.charCodeAt(i)&255;
  return u;
}

function unlock(buf,pwd){
  var i;
  for(i=0;i<4;i++){ if(buf[i]!==MAGIC[i]) throw new Error('数据文件不是本工具生成的'); }
  var salt=buf.subarray(4,4+SALT_LEN), ct=buf.subarray(4+SALT_LEN);
  var pt=rc4(kdf(pwd,salt), ct);
  var txt=utf8(pt);
  if(txt.charAt(0)!=='{'||txt.charAt(txt.length-1)!=='}') throw new Error('口令不正确');
  return txt;
}

/* 规范化：去掉所有空白（含全角空格）后转小写，用于「完整匹配」比较。 */
function norm(s){ return String(s==null?'':s).replace(/[\s\u3000]+/g,'').toLowerCase(); }

/* 只有输入了「完整」的零件号（或完整名称）才显示对应那一条。
   空输入 / 半个零件号一律不显示任何零件 —— 避免解锁后整表数据被一览无余。 */
function draw(){
  var kw=norm(q.value), n=0, frag=document.createDocumentFragment();
  if(kw){
    for(var r=0;r<DATA.length;r++){
      var row=DATA[r], part=row[0], name=row[1], stock=row[3], cut=row[5], qtys=row[6];
      if(norm(part)!==kw && norm(name)!==kw) continue;
      if(n>=200) break;
      n++;
      var tr=document.createElement('tr'), i;
      var hh='<td class="p">'+esc(part)+'</td><td class="p">'+esc(name)+'</td>'
            +'<td>'+fmt(stock)+'</td><td class="'+(cut?'hot':'')+'">'+(cut||'-')+'</td>';
      for(i=0;i<qtys.length;i++){ var v=qtys[i]; hh+='<td class="'+(v==null?'zero':'')+'">'+fmt(v)+'</td>'; }
      tr.innerHTML=hh; frag.appendChild(tr);
    }
  }
  if(body.replaceChildren) body.replaceChildren(frag);
  else { body.innerHTML=''; body.appendChild(frag); }
  if(!kw){ empty.textContent='请输入完整零件号，查看该零件的生产计划'; }
  else if(!n){ empty.textContent='未找到「'+(q.value||'').trim()+'」，请确认零件号是否输入完整'; }
  else { empty.textContent=''; }
  empty.style.display=n?'none':'block';
  tbl.style.display=n?'':'none';
}

function stats(){
  var m=META.summary||{}, ms=MODELS.summary||{};
  var items=[['零件数',m.parts],['日期区间',(m.date_from||'')+' ~ '+(m.date_to||'')],['断料预警',m.alerts]];
  if(ms.count) items.push(['车型数',ms.count]);
  statsEl.innerHTML=items.map(function(it){
    return '<div class="stat"><b>'+esc(it[1])+'</b><span>'+esc(it[0])+'</span></div>';
  }).join('');
  metaEl.textContent='数据生成于 '+(META.generated_at||'')+' · 每日 08:00 更新 · 本页离线可用';
}

function loadData(){
  if(EMBED) return b64ToBytes(EMBED);
  if(typeof fetch!=='function') throw new Error('当前环境不支持读取数据文件，请改用单文件版');
  return fetch(DATA_URL).then(function(res){
    if(!res.ok) throw new Error('数据加载失败 ('+res.status+')');
    return res.arrayBuffer();
  }).then(function(ab){ return new Uint8Array(ab); });
}

function show(o){
  DATA=o.rows||[]; DATES=o.dates||[]; META=o.meta||{}; MODELS=o.models||{};
  gate.style.display='none'; hdr.hidden=false;
  stats(); mselInit(); mhead(); mdraw(); head(); draw();
}

function boot(pwd){
  go.disabled=true; err.textContent='正在解锁…';
  setTimeout(function(){
    try{
      var buf=EMBED?b64ToBytes(EMBED):null;
      if(!buf){ throw new Error('当前 Environment 只支持单文件版'); }
      var txt=unlock(buf,pwd);
      var o=JSON.parse(txt);
      if(rm&&rm.checked) lsSet(PWKEY,pwd); else lsDel(PWKEY);
      show(o);
    }catch(e){
      err.textContent=(e&&e.message==='口令不正确')?'口令不正确':'解锁失败：'+(e&&e.message||e);
      go.disabled=false; pw.select&&pw.select();
    }
  },10);
}

function bootAsync(pwd){
  go.disabled=true; err.textContent='正在解锁…';
  loadData().then(function(buf){
    var txt=unlock(buf,pwd);
    var o=JSON.parse(txt);
    if(rm&&rm.checked) lsSet(PWKEY,pwd); else lsDel(PWKEY);
    show(o);
  }).catch(function(e){
    err.textContent=(e&&e.message==='口令不正确')?'口令不正确':'解锁失败：'+(e&&e.message||e);
    go.disabled=false;
  });
}

function tryPwd(pwd){
  if(EMBED) boot(pwd); else bootAsync(pwd);
}

go.addEventListener('click',function(){ if(pw.value) tryPwd(pw.value); });
pw.addEventListener('keydown',function(e){ if(e.key==='Enter'&&pw.value) tryPwd(pw.value); });
q.addEventListener('input',draw);
if(msel) msel.addEventListener('change',mdraw);

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    try{ Promise.resolve().catch(function(){}); }catch(e){}
  });
}

var saved=lsGet(PWKEY);
if(saved){ tryPwd(saved); } else { gate.style.display='flex'; }

if(typeof module!=='undefined'&&module.exports){
  module.exports={sha256:sha256,kdf:kdf,rc4:rc4,unlock:unlock,b64ToBytes:b64ToBytes};
}
</script>
